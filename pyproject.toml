[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ngpbh"
version = "0.5.0"
description = "Threshold statistics and peaks theory for the PBH abundance with local non-Gaussianity"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Duong Ngoc Khoa" }]
dependencies = ["numpy>=2.0", "scipy>=1.11"]  # np.trapezoid needs NumPy 2

[project.optional-dependencies]
dev = ["pytest>=7", "matplotlib>=3.5"]
compare = ["pbhstat>=0.0.6"]
digitize = ["pymupdf>=1.24"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ngpbh = ["data/*.dat"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: long-running validation tests"]
